<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="finGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
  </defs>
  <!-- Rounded App Tile -->
  <rect width="64" height="64" rx="16" fill="url(#finGradient)" />
  
  <!-- Calculator Screen Bar -->
  <rect x="14" y="13" width="36" height="11" rx="3.5" fill="#ffffff" fill-opacity="0.95" />
  
  <!-- Mini Display Digits / Symbol inside screen -->
  <circle cx="21" cy="18.5" r="2" fill="#4338ca" />
  <circle cx="28" cy="18.5" r="2" fill="#4338ca" />
  <rect x="34" y="17" width="10" height="3" rx="1.5" fill="#4338ca" />
  
  <!-- Calculator Keypad Grid -->
  <!-- Row 1 -->
  <rect x="14" y="28" width="9" height="7" rx="2" fill="#ffffff" fill-opacity="0.25" />
  <rect x="27" y="28" width="9" height="7" rx="2" fill="#ffffff" fill-opacity="0.25" />
  <rect x="41" y="28" width="9" height="7" rx="2" fill="#34d399" /> <!-- Accent key (like = or enter) -->
  
  <!-- Row 2 -->
  <rect x="14" y="38" width="9" height="7" rx="2" fill="#ffffff" fill-opacity="0.25" />
  <rect x="27" y="38" width="9" height="7" rx="2" fill="#ffffff" fill-opacity="0.25" />
  <rect x="41" y="38" width="9" height="7" rx="2" fill="#ffffff" fill-opacity="0.25" />
  
  <!-- Row 3 / Currency Symbol overlay or bottom row -->
  <rect x="14" y="48" width="22" height="7" rx="2" fill="#ffffff" fill-opacity="0.35" />
  <rect x="41" y="48" width="9" height="7" rx="2" fill="#fbbf24" /> <!-- Gold coin / crypto accent -->
</svg>
